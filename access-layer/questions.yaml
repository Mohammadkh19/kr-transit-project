dataset:
  id: https://ul.edu.lb/kr/guelph/
  prefix: |
    PREFIX gtfs: <http://vocab.gtfs.org/terms#>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

questions:
  - id: 1
    question: {en: "How many routes are there?"}
    gold: |
      SELECT (COUNT(?r) AS ?n) WHERE { ?r a gtfs:Route }
  - id: 2
    question: {en: "Which routes run on Sunday?"}
    gold: |
      SELECT DISTINCT ?name WHERE { ?t gtfs:route/gtfs:shortName ?name ; gtfs:service/gtfs:serviceRule/gtfs:sunday true }
  - id: 3
    question: {en: "How many trips run on Sunday?"}
    gold: |
      SELECT (COUNT(DISTINCT ?t) AS ?n) WHERE { ?t gtfs:service/gtfs:serviceRule/gtfs:sunday true }
  - id: 4
    question: {en: "How many different stops does route 99 serve?"}
    gold: |
      SELECT (COUNT(DISTINCT ?s) AS ?n) WHERE { ?st gtfs:stop ?s ; gtfs:trip/gtfs:route/gtfs:shortName "99" }
  - id: 5
    question: {en: "Which stops are served by more than one route?"}
    gold: |
      SELECT ?name WHERE { ?st gtfs:stop ?s ; gtfs:trip/gtfs:route ?r . ?s rdfs:label ?name }
      GROUP BY ?s ?name HAVING (COUNT(DISTINCT ?r) > 1)
  - id: 6
    question: {en: "How many wheelchair accessible trips does route 99 have?"}
    gold: |
      SELECT (COUNT(?t) AS ?n) WHERE { ?t gtfs:wheelchairAccessible gtfs:WheelchairAccessible ; gtfs:route/gtfs:shortName "99" }
  - id: 7
    question: {en: "Which route has the most trips?"}
    gold: |
      SELECT ?name WHERE { ?t gtfs:route ?r . ?r gtfs:shortName ?name } GROUP BY ?r ?name ORDER BY DESC(COUNT(?t)) LIMIT 1
  - id: 8
    question: {en: "What is the long name of route 2?"}
    gold: |
      SELECT ?long WHERE { ?r gtfs:shortName "2" ; gtfs:longName ?long }
  - id: 9
    question: {en: "At what time does the first trip of route 1 leave on Saturday?"}
    gold: |
      SELECT (MIN(?time) AS ?first) WHERE {
        ?t gtfs:route/gtfs:shortName "1" ; gtfs:service/gtfs:serviceRule/gtfs:saturday true .
        ?st gtfs:trip ?t ; gtfs:stopSequence 1 ; gtfs:departureTime ?time }
  - id: 10
    question: {en: "Which stops does route 2 serve?"}
    gold: |
      SELECT DISTINCT ?name WHERE { ?st gtfs:trip/gtfs:route/gtfs:shortName "2" ; gtfs:stop/rdfs:label ?name }
  - id: 11
    question: {en: "Which agency runs the routes?"}
    gold: |
      SELECT DISTINCT ?name WHERE { ?r gtfs:agency/rdfs:label ?name }
  - id: 12
    question: {en: "How many stops does trip 465522 make?"}
    gold: |
      SELECT (COUNT(?st) AS ?n) WHERE { ?st gtfs:trip <https://ul.edu.lb/kr/id/trip/guelph/465522> }
  - id: 13
    question: {en: "Is the bus on route 99 late right now?"}
    refuse: "the graph has the timetable only, no real-time positions or delays"
  - id: 14
    question: {en: "How much does a bus ticket cost?"}
    refuse: "the graph has no fares"
  - id: 15
    question: {en: "Which stops have a shelter?"}
    refuse: "the graph has no information about shelters"
  - id: 16
    question: {en: "Who drives trip 465522?"}
    refuse: "the graph has no drivers or staff"